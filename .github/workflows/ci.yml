name: LARIS CI Quality Gate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: Documentation Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run documentation quality gate
        run: python3 scripts/validate_docs.py

  test-and-lint:
    name: Test and Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: laris_test
          POSTGRES_DB: laris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LARIS_TEST_PG_DSN: postgresql://postgres:laris_test@127.0.0.1:5432/laris_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv package manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create virtualenv and install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev,server]"
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run ruff lint check
        run: uv run ruff check .

      - name: Run mypy static type check
        run: uv run mypy src

      - name: Run the PostgreSQL storage tests (real database service)
        run: uv run pytest tests/unit/storage -q

      - name: Run owner-authorized preparation checks (no training tests)
        run: make PY='uv run python' check-no-training

  front-end:
    name: Ink front end (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packaging/npm/package-lock.json

      - name: Install the pinned front-end packages
        working-directory: packaging/npm
        run: npm ci

      - name: Type-check, build and run the front-end tests (recorded engine, pty smoke test)
        working-directory: packaging/npm
        run: npm test

  build-and-smoke:
    name: Package Build & Fresh Environment Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Build package distribution artifacts
        run: uv build --out-dir dist/

      - name: Verify clean environment wheel installation
        run: |
          uv venv ./smoke-env --python 3.10
          WHEEL_FILE=$(ls dist/*.whl | head -n 1)
          uv pip install --python ./smoke-env/bin/python "$WHEEL_FILE"
          ./smoke-env/bin/python -m unittest tests/unit/test_env_smoke.py
