name: ci

on:
  pull_request:
    branches: [laris-v2]
  push:
    branches: [laris-v2]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - name: No-training guard
        run: cargo xtask guard
      - name: Hardcoded endpoint and secret scan
        run: cargo xtask scan
      - name: JSON Schema files are current
        run: cargo xtask schema --check
      - name: Spec ledger
        run: cargo xtask spec
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --offline --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --offline --locked
      - name: Offline build from the vendor folder
        run: cargo build --workspace --offline --frozen
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Deny
        run: cargo deny check

  security:
    # T154: the security suite of the threat model (docs/architecture/THREAT_MODEL.md, tests/security/suite.json).
    # Every threat row must have its tests; the PostgreSQL tests run against a throwaway service (no password: the
    # container trusts only this job's own network).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LARIS_TEST_PG_DSN: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Security suite
        run: cargo xtask security

  performance:
    # T154: budgets were fixed on the development workstation (reports/performance/rust_budgets.json). A shared runner
    # can be slower, so this job reports and does not block until the owner has seen its first figures.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - name: Budgets
        run: cargo xtask bench --runs 3 --out /tmp/rust_bench.json

  model-block:
    # T94: checks of the Python model block. The guard inside the script excludes every test that
    # trains or profiles with an optimizer; nothing here authorizes training.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the model block
        run: python -m pip install -e ".[dev,model,server]"
      - name: Verify the model block
        run: python scripts/verify_model_block.py
      - name: Spec ledger (reference implementation)
        run: python scripts/validate_spec.py
