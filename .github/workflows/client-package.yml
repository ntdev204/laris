name: Client package (all platforms)

# Builds the LARIS client as a self-contained program (no Python needed on the user's machine) for
# Linux x64/arm64, macOS Apple Silicon/Intel and Windows x64, then assembles the npm packages:
# one `@ntdev204/laris-cli-<platform>` per platform plus the launcher `@ntdev204/laris-cli`.
#
# Runs on release branches and by hand (build + artifacts only). It publishes to npm only when a
# `v*` tag is pushed, or when started by hand with `publish: true`, and only with the repository
# secret NPM_TOKEN (a granular "Automation" access token that can publish @ntdev204 packages).

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the packages to npm (needs the NPM_TOKEN secret)"
        type: boolean
        default: false
  push:
    branches: ["release/**"]
    tags: ["v*"]

jobs:
  binary:
    name: Program ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64 }
          - { os: ubuntu-24.04-arm, platform: linux-arm64 }
          - { os: macos-latest, platform: darwin-arm64 }
          - { os: macos-15-intel, platform: darwin-x64 }
          - { os: windows-latest, platform: win32-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build tools and runtime libraries (the smoke test imports every module)
        run: python -m pip install --upgrade pip setuptools wheel "cython>=3.0,<4" pyyaml pydantic numpy pyarrow
      - name: Compile the client wheel
        run: python packaging/build_client.py dist-wheel
      - name: Freeze it into a self-contained program and smoke-test it
        run: python packaging/build_binary.py dist-wheel dist-binary
      - name: Archive (CI artifacts lose file modes)
        run: tar -czf laris.tar.gz -C dist-binary laris
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: laris.tar.gz
          if-no-files-found: error

  package:
    name: Assemble npm packages
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the Ink front end the launcher ships
        working-directory: packaging/npm
        run: |
          npm ci
          npm test
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: artifacts
      - name: Split into per-platform packages plus the launcher
        run: python packaging/assemble_npm.py artifacts npm-out
      - name: Pack every package (nothing is published here)
        run: |
          mkdir tarballs
          for d in npm-out/*/; do (cd "$d" && npm pack --ignore-scripts --pack-destination ../../tarballs); done
          ls -la tarballs
      - uses: actions/upload-artifact@v4
        with:
          name: laris-cli-npm-packages
          path: tarballs/*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: laris-cli-npm-packages
          path: tarballs
      - name: Publish the platform packages first, the launcher last
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN repository secret is not set; nothing was published."
            exit 1
          fi
          # A package version that is already on the registry is skipped, so a re-run is safe.
          publish() {
            name=$(tar -xzOf "$1" package/package.json | python3 -c "import json,sys;print(json.load(sys.stdin)['name'])")
            ver=$(tar -xzOf "$1" package/package.json | python3 -c "import json,sys;print(json.load(sys.stdin)['version'])")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "$name@$ver already published, skipping"
            else
              npm publish "./$1" --access public
            fi
          }
          for f in tarballs/ntdev204-laris-cli-*-*.tgz; do publish "$f"; done
          for f in tarballs/ntdev204-laris-cli-[0-9]*.tgz; do publish "$f"; done
