name: release-build

# T159: builds, packages and signs the client archives. Manual only. Needs the secret LARIS_RELEASE_KEY (the PEM
# private key made by `cargo xtask dist keygen`) and the variable LARIS_RELEASE_URL (the https address of the release:
# `https://github.com/<owner>/<repo>/releases/download`, so that `<address>/<version>/<file>` is a release asset).
# With the input `publish` (owner's order, 2026-11-20, D42 amended) it also creates the GitHub release named by the
# workspace version (tag without `v`, the layout the installers expect) with the signed archives, and publishes the npm
# package with the secret NPM_TOKEN. The variable LARIS_DEFAULT_SERVER_URL (optional) is compiled into the client as its
# default server address (`LARIS_BUILD_DEFAULTS`), so that a user only has to enter a key. The same defaults carry the
# update source (T251): LARIS_RELEASE_URL and the public half of the signing key, so a client updates itself from the
# release named `latest`. Without it, nothing is published.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub release and publish the npm package"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true }
          - { os: macos-latest, target: x86_64-apple-darwin, cross: false }
          - { os: macos-latest, target: aarch64-apple-darwin, cross: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, cross: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - name: Packaged defaults (the server address and the update source clients start with)
        shell: bash
        env:
          KEY: ${{ secrets.LARIS_RELEASE_KEY }}
        run: |
          # the update source is the release address and the public half of the signing key (T251)
          server="${{ vars.LARIS_DEFAULT_SERVER_URL }}"
          release="${{ vars.LARIS_RELEASE_URL }}"
          verifier=""
          if [ -n "$release" ] && [ -n "$KEY" ]; then
            umask 077
            printf '%s\n' "$KEY" > "$RUNNER_TEMP/release.key"
            verifier=$(openssl ec -pubout -in "$RUNNER_TEMP/release.key" -outform DER 2>/dev/null | base64 | tr -d '\n')
            rm -f "$RUNNER_TEMP/release.key"
          fi
          parts=""
          [ -z "$server" ] || parts="\"server\":{\"url\":\"$server\"}"
          if [ -n "$release" ] && [ -n "$verifier" ]; then
            [ -z "$parts" ] || parts="$parts,"
            parts="$parts\"update\":{\"url\":\"$release\",\"signatureVerifier\":\"$verifier\"}"
          fi
          [ -z "$parts" ] || echo "LARIS_BUILD_DEFAULTS={$parts}" >> "$GITHUB_ENV"
      - name: Build with cross (static Linux)
        if: matrix.cross
        run: |
          # outside the repository: its .cargo/config.toml replaces crates-io with the vendor folder
          (cd "$RUNNER_TEMP" && cargo install cross --locked --version 0.2.5)
          cross build --release --offline --locked --target ${{ matrix.target }} -p laris-cli
      - name: Build natively
        if: ${{ !matrix.cross }}
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --offline --locked --target ${{ matrix.target }} -p laris-cli
      - name: Package
        shell: bash
        run: |
          ext=""; [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ] && ext=".exe"
          cargo xtask dist package --target ${{ matrix.target }} --bin "target/${{ matrix.target }}/release/laris$ext" --out out
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: out/*

  sign:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: archive-*
          merge-multiple: true
      - name: Manifest, signature, installers
        env:
          LARIS_RELEASE_URL: ${{ vars.LARIS_RELEASE_URL }}
          KEY: ${{ secrets.LARIS_RELEASE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/release.key"
          openssl ec -pubout -in "$RUNNER_TEMP/release.key" -out "$RUNNER_TEMP/release.pub"
          cargo xtask dist manifest --dir out
          LARIS_RELEASE_KEY="$RUNNER_TEMP/release.key" cargo xtask dist sign --dir out
          cargo xtask dist verify --dir out --pubkey "$RUNNER_TEMP/release.pub"
          cargo xtask dist scripts --dir out/installers --pubkey "$RUNNER_TEMP/release.pub"
          rm -f "$RUNNER_TEMP/release.key"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: out

  publish:
    if: ${{ inputs.publish }}
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: out
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/ s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$version" ] || { echo "no workspace version"; exit 1; }
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release view "$version" >/dev/null 2>&1 && echo "release $version exists: kept" || \
          gh release create "$version" --target "${{ github.sha }}" --title "LARIS $version" --notes-file notes.md --latest \
            out/laris-* out/SHA256SUMS out/SHA256SUMS.sig out/VERSION out/installers/install.sh out/installers/install.ps1
          # the rolling release named `latest` is what the installers and the client's updater read:
          # `<address>/latest/SHA256SUMS`, `.sig` and `VERSION` say which version is current, and its archives are
          # the current ones (not the newest release by date, so it is never marked as the GitHub "latest")
          gh release view latest >/dev/null 2>&1 || \
          gh release create latest --target "${{ github.sha }}" --title "LARIS latest (rolling)" --latest=false \
            --notes "The files of the current release, read by the installers and by the client's automatic update."
          gh release upload latest --clobber \
            out/laris-* out/SHA256SUMS out/SHA256SUMS.sig out/VERSION
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: npm publish
        working-directory: out/installers/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
