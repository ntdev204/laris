name = "document-intake"
version = "2.0.0"
description = "Look at files the user wants added to their material and report what is fit to add and what is not."
triggers = ["add documents", "index these files"]
allowed_tools = ["Glob", "Read", "update_plan"]
max_steps = 6
require_citations = false
approval = "ask"
output_sections = ["Fit to add", "Skipped", "Next step"]
stop_conditions = ["the user declines to add a file"]

[[phases]]
id = "inspect"
goal = "List the given folder or file and read a short sample of each kind of file."
instructions = "Do not accept files that look like credentials or internal configuration; report them instead."
exit = "Every candidate is marked accept or skip, with a reason."

[[phases]]
id = "report"
goal = "Report what is fit to add and what was skipped, and ask the user to confirm before anything is added."
