[package]
name = "laris-policy"
description = "Permission modes, rules, hooks, folder trust, redaction and learning data."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
laris-config = { path = "../laris-config", version = "2.0.0-dev" }
laris-core = { path = "../laris-core", version = "2.0.0-dev" }
laris-evidence = { path = "../laris-evidence", version = "2.0.0-dev" }
laris-protocol = { path = "../laris-protocol", version = "2.0.0-dev" }
laris-retrieval = { path = "../laris-retrieval", version = "2.0.0-dev" }
laris-store = { path = "../laris-store", version = "2.0.0-dev" }
laris-tools = { path = "../laris-tools", version = "2.0.0-dev" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[dev-dependencies]
laris-vault = { path = "../laris-vault", version = "2.0.0-dev" }

[lints]
workspace = true
