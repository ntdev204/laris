[package]
name = "laris-sandbox"
description = "OS confinement forked from codex; Python environment."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "laris-sandbox-helper"
path = "src/bin/helper.rs"

[dependencies]
thiserror = "2"
laris-config = { path = "../laris-config", version = "2.0.0-dev" }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"
rustix = { version = "1", features = ["thread"] }
libc = "0.2"

[lints]
workspace = true
