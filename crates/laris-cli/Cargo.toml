[package]
name = "laris-cli"
description = "Binary laris."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "laris_cli"
path = "src/lib.rs"

[[bin]]
name = "laris"
path = "src/main.rs"

[dependencies]
laris-config = { path = "../laris-config", version = "2.0.0-dev" }
laris-policy = { path = "../laris-policy", version = "2.0.0-dev" }
laris-store = { path = "../laris-store", version = "2.0.0-dev" }
serde_json = "1"

[dev-dependencies]
laris-core = { path = "../laris-core", version = "2.0.0-dev" }
laris-protocol = { path = "../laris-protocol", version = "2.0.0-dev" }

[lints]
workspace = true
