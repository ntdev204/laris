[package]
name = "laris-gap"
description = "Research-gap analysis over papers that were read: sections, extraction records, knowledge links, gap rules G1-G4, ranking, citation audit and evaluation."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
laris-retrieval = { path = "../laris-retrieval", version = "1.7.0" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[lints]
workspace = true
