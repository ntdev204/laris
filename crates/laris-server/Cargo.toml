[package]
name = "laris-server"
description = "Binary laris-server."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
laris-brain = { path = "../laris-brain", version = "1.7.1" }
laris-config = { path = "../laris-config", version = "1.7.1" }
laris-core = { path = "../laris-core", version = "1.7.1" }
laris-gap = { path = "../laris-gap", version = "1.7.1" }
laris-model-client = { path = "../laris-model-client", version = "1.7.1" }
laris-policy = { path = "../laris-policy", version = "1.7.1" }
laris-protocol = { path = "../laris-protocol", version = "1.7.1" }
laris-retrieval = { path = "../laris-retrieval", version = "1.7.1" }
laris-tools = { path = "../laris-tools", version = "1.7.1" }
laris-vault = { path = "../laris-vault", version = "1.7.1" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service", "server"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
regex = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
serde = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal"] }

[dev-dependencies]
laris-evidence = { path = "../laris-evidence", version = "1.7.1" }
laris-sandbox = { path = "../laris-sandbox", version = "1.7.1" }
laris-store = { path = "../laris-store", version = "1.7.1" }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "test-util"] }
