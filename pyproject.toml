[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laris"
version = "2.2.0"
description = "Local Autonomous Research & Intelligence System (LARIS) - Epistemic scientific research engine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "LARIS Architecture Team" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
]

[project.optional-dependencies]
ocr = [
    "Pillow==12.3.0",
    "pytesseract==0.3.13",
    "pypdf==7.0.1",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "types-PyYAML>=6.0.12",
]
server = [
    "fastapi>=0.162,<1",  # ADR-019: P1 API
    "uvicorn>=0.54,<1",
    "psycopg[binary]>=3.3,<4",  # ADR-019: PostgreSQL driver
    "psycopg_pool>=3.3,<4",
    "cryptography>=42,<51",  # AES-GCM for API keys stored by the model server (not in the client)
]
model = [
    "fastapi>=0.162,<1",  # ADR-019: P2 model service
    "uvicorn>=0.54,<1",
]
chat = [
    "fastapi>=0.162,<1",  # T231: the open-weight chat backend (ADR-021); exact pins, reviewed by the owner
    "uvicorn>=0.54,<1",
    "torch>=2.6.0",
    "transformers==5.22.2",
    "accelerate==1.15.0",
    "bitsandbytes==0.50.2",
]
build = [
    "cython>=3.0,<4",  # build time only: compiles the client wheel so it ships no readable source
]
gpu = [
    "torch>=2.6.0",
]

[project.scripts]
laris-model = "cli.model:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"laris.shared.harness" = ["public_strings.yaml"]
"laris.server.storage" = ["migrations/*.sql"]
"laris.protocol" = ["e1.schema.json"]
"laris.shared.config" = ["settings.schema.json"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
markers = [
    "torch: requires PyTorch",
    "gpu: requires a CUDA device",
    "network: requires network access",
    "slow: long-running test",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
