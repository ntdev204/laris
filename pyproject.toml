[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laris"
version = "1.1.2"
description = "Local Autonomous Research & Intelligence System (LARIS) - Epistemic scientific research engine"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "LARIS Architecture Team" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "types-PyYAML>=6.0.12",
]
gpu = [
    "torch>=2.6.0",
]
tokenizer = [
    "sentencepiece>=0.1.99",
]
training = [
    "torch>=2.6.0",
    "sentencepiece>=0.1.99",
    "bitsandbytes>=0.43.0; sys_platform == 'linux'",
]

[project.scripts]
laris = "laris.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
markers = [
    "torch: requires PyTorch",
    "gpu: requires a CUDA device",
    "network: requires network access",
    "slow: long-running test",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
