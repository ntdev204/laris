# T203 stage-2 mixture (PROPOSAL, not run): continues from artifacts/checkpoints/language_encoder/english-r1-pilot2/best (pilot 2, step 2,000,
# MLM learned, pair tasks at chance) with a fresh optimizer (`--init-from`, new `--run-id`). The pair tasks, the two-segment MLM rows with the order
# labels and the contrastive similarity task get about 66 % of the scheduler probability (floors); MLM keeps 22 % (21 % of the batch draws),
# retrieval 12 %. With `tasks_per_step: 2` (T202: 13.12 GB worst pair) each micro-step carries two different tasks. Numbers per task:
# reports/verification/T203-stage2-schedule.md (computed by scripts/plan_stage2_schedule.py, not measured). Floors, weights and the
# warmup are unmeasured proposals; the control (english_r1_stage2_control.yaml) is the same run with the original mixture.
# Run only on the owner's order (T204); nothing here authorises a run.
config_version: "1.0.0"
environment: "foundation-pretraining"

model:
  # 56k because the 32k fit measured fertility 1.41 on English validation text (gate 1.35); T182.
  vocab_size: 56000
  max_sequence_length: 1024
  d_model: 1280
  num_layers: 24
  num_heads: 20
  d_ff: 5120
  dropout: 0.1
  norm_type: "rmsnorm"
  pos_encoding: "rope"
  activation: "gelu"
  tie_embeddings: true
  precision: "bf16"
  seed: 42

training:
  batch_size: 32
  micro_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  warmup_steps: 300
  max_steps: 5000
  loss_lambda_mlm: 0.50
  loss_lambda_nli: 0.20
  loss_lambda_para: 0.10
  loss_lambda_sim: 0.05
  loss_lambda_qa: 0.15
  # Dense-retrieval task (T178): query/positive pairs from GooAQ, Natural Questions, MS MARCO, ELI5, Yahoo Answers,
  # Stack Exchange duplicates, SPECTER, AltLex, Simple-Wiki and COCO captions (data/processed, leakage-scanned
  # against the G12 sources). In-batch negatives only; the weight multiplies the InfoNCE loss (about ln(batch) at
  # the start), so it is a PROPOSAL to revisit after the profile and the pilot loss curves. With the task on, the
  # QA auxiliary contrastive term (same weight) is also on.
  retrieval_task: true
  loss_lambda_retrieval: 0.20
  retrieval_temperature: 0.07
  # More in-batch negatives than the 8-pair micro-batch of the other tasks, and passages cut at 256 tokens (queries
  # are short; the benchmark passages are paragraphs). The profile (runbook 9.2 step 2) measures the memory; lower
  # the batch size if it does not fit.
  retrieval_batch_size: 32
  retrieval_max_sequence_length: 256
  task_sampling_alpha: 0.7
  # Similarity has 20 k rows: at alpha 0.7 it is drawn for 0.5 % of the steps (25 of 5,000), which did not move its loss
  # in the first 980 pilot steps. A floor of 3 % (150 of 5,000 steps) is an unmeasured proposal.
  task_sampling_floor:
    nli: 0.17
    paraphrase: 0.13
    qa: 0.11
    similarity: 0.08
    contrastive_sim: 0.17
  # Within a task, datasets are drawn with probability proportional to (rows ** exponent) / total, so one large
  # source (FineWeb-Edu is 44 % of the MLM passages) does not take the whole task.
  dataset_sampling_exponents:
    mlm: 0.6
    nli: 0.7
    paraphrase: 0.7
    qa: 0.7
    retrieval: 0.5

  # T207 per-dataset factors on the rows ** exponent weight (applied with --dataset-sampling-ablation, like the exponents);
  # solved by scripts/measure_mixture_shares.py, report reports/verification/T207-mixture-shares.json:
  # QA no-answer share 0.0996 -> 0.132 (squad_v2_en), model-labelled paws_unlabeled_en capped at 15 % of paraphrase,
  # VitaminC at 10 % of NLI.
  dataset_sampling_weights:
    qa:
      squad_v2_en: 1.695
    paraphrase:
      paws_unlabeled_en: 0.17
    nli:
      vitaminc_en: 0.375

  # --- T203 stage-2 additions ---
  mlm_pair_fraction: 0.5
  order_task: true
  loss_lambda_order: 0.1
  similarity_head: bi_encoder
  contrastive_sim_task: true
  loss_lambda_contrastive_sim: 0.5
  contrastive_sim_batch_size: 64
  contrastive_sim_max_sequence_length: 128
  label_balanced_tasks: [nli, paraphrase]
  tasks_per_step: 2

hardware:
  max_vram_gb: 14.5
  target_device: "cuda"
