# STEM selection for S2ORC by Semantic Scholar `s2fieldsofstudy` (replaces the external-id approximation).
# A paper is STEM when any of its fields of study is listed here. Semantic Scholar assigns these categories itself
# (model-predicted or publisher-supplied, see the `source` of each entry); they are labels, not ground truth.
config_version: "1.0.0"
dataset: papers
workers: 24
index_dir: data/cache/s2_fields
stem_fields:
  - Computer Science
  - Mathematics
  - Physics
  - Chemistry
  - Biology
  - Materials Science
  - Engineering
  - Environmental Science
  - Geology
  - Medicine
  - Agricultural and Food Sciences
