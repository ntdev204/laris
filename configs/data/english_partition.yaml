# Partitioning of the English stage-1 sources (T177, D46 / ADR-022). Output: data/processed/<dir>/{train,val,test}.parquet
# in the schemas the training loader already reads. Seeds, ratios and chunk sizes live here, not in code.
config_version: "1.0.0"
seed: "laris-english-partition-v1"
mlm_ratios: {train: 0.98, val: 0.01, test: 0.01}
supervised_ratios: {train: 0.90, val: 0.05, test: 0.05}
# The loader keeps only the first seq_len tokens of a record, so long documents are cut into passages at paragraph
# boundaries; 4000 characters is about 950 tokens, matching a 1024-token training sequence.
mlm_chunk_chars: 4000
mlm_min_chunk_chars: 400
# Exact duplicates (case, whitespace and NFC-normalised full document) are dropped across all MLM sources and
# against English Wikipedia.
dedupe_against: [wikipedia_en]

mlm:
  - {id: FINEWEB-EDU-EN, text: text, doc_id: id}
  - {id: OPENWEBTEXT-EN, text: text}
  - {id: C4-EN, text: text, url: url}
  - {id: GUTENBERG-EN, text: text, doc_id: id}
  - {id: CC-NEWS-EN, text: text, doc_id: url}
  - {id: CNN-DAILYMAIL-EN, text: article, doc_id: id}
  - {id: XSUM-EN, text: document, doc_id: id}
  - {id: WIKIPEDIA-SIMPLE-EN, text: text, doc_id: id}
  # STEM slice (T179, T180): science, mathematics, engineering and technology sources, documents split by hash like
  # every MLM source. Used for the tokenizer fit vocabulary (STEM terms); not part of the stage-1 training mixture.
  - {id: ARXIV-FULLTEXT, text: article}
  - {id: PUBMED-FULLTEXT, text: article}
  - {id: OPEN-WEB-MATH, text: text, doc_id: url}
  - {id: SE-ELECTRONICS, text: ThreadText, doc_id: Id}
  - {id: SE-ENGINEERING, text: ThreadText, doc_id: Id}
  - {id: SE-MECHANICS, text: ThreadText, doc_id: Id}
  - {id: SE-ROBOTICS, text: ThreadText, doc_id: Id}
  - {id: SE-MATERIALS, text: ThreadText, doc_id: Id}
  - {id: SE-IOT, text: ThreadText, doc_id: Id}
  - {id: SE-SOFTWAREENGINEERING, text: ThreadText, doc_id: Id}
  - {id: SE-CS, text: ThreadText, doc_id: Id}
  - {id: SE-NETWORKENGINEERING, text: ThreadText, doc_id: Id}
  - {id: SE-DEVOPS, text: ThreadText, doc_id: Id}
  - {id: SE-REVERSEENGINEERING, text: ThreadText, doc_id: Id}
  # Patents before 1976 are OCR output with heavy noise; the filter keeps the clean digital era.
  - {id: USPTO-PATENTS, text: text, doc_id: id, min_date: {field: created, value: "1976-01-01"}}

nli:
  - {id: WANLI-EN, premise: premise, hypothesis: hypothesis, label: gold}
  - {id: SCITAIL-EN, premise: sentence1, hypothesis: sentence2, label: gold_label, label_map: {entails: entailment, neutral: neutral}}

paraphrase:
  - {id: MRPC-EN, sentence1: sentence1, sentence2: sentence2, label: label}

qa:
  # Rows whose article or context also sits in the SQuAD v1 validation or test partition are dropped, so G06 and G07
  # stay clean (SQuAD v2 and AdversarialQA are built on SQuAD v1 articles).
  - {id: SQUAD-V2-EN}
  - {id: ADVERSARIAL-QA-EN}

similarity_extra:
  # Already leakage-filtered against STS-B validation and test by scripts/check_sts_leakage.py.
  source: data/processed/sts_extra_en/train.parquet

# English tokenizer fit corpus (T177). Train splits only, word budgets per source, deterministic row-group order.
# Fitting itself is an owner run; this only prepares the text.
tokenizer_fit:
  seed: 42
  output: data/cache/english_fit_corpus.txt
  report: data/cache/english_fit_corpus.json
  words:
    wikipedia_en: 80000000
    fineweb_edu_en: 100000000
    openwebtext_en: 50000000
    c4_en: 40000000
    gutenberg_en: 40000000
    cc_news_en: 20000000
    cnn_dailymail_en: 10000000
    xsum_en: 5000000
    wikipedia_simple_en: 5000000
    # STEM vocabulary (T179, T180): about 50 M words, 12-13% of the fit corpus (owner range 10-15%). Science 18 M,
    # mathematics 12 M, engineering 12.6 M, technology 7 M. S2ORC stays out (stage 2, ADR-022).
    arxiv_fulltext: 9000000
    pubmed_fulltext: 9000000
    open_web_math: 12000000
    se_electronics: 3000000
    se_engineering: 1000000
    se_mechanics: 1200000
    se_robotics: 600000
    se_materials: 400000
    se_iot: 400000
    uspto_patents: 6000000
    se_softwareengineering: 3000000
    se_cs: 2000000
    se_networkengineering: 1000000
    se_devops: 400000
    se_reverseengineering: 600000
