# cargo-deny policy (T121, ADR-021 D29). Only crates approved in T119 may be used.
# Adding a crate is a reviewed edit of this file, made only after the owner's approval.

[graph]
all-features = true

[advisories]
version = 2
ignore = []

[licenses]
version = 2
# Zlib comes with foldhash (hashbrown, under rusqlite; T129, owner to confirm).
# ISC and BSD-3-Clause come with the approved TLS stack (ring, rustls-webpki, untrusted, subtle); added in T128, owner to confirm.
allow = ["Apache-2.0", "MIT", "Unicode-3.0", "ISC", "BSD-3-Clause", "Zlib"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `allow` makes every crate outside the list a failure, workspace crates included.
allow = [
    # workspace crates
    "xtask", "laris-protocol", "laris-config", "laris-vault", "laris-retrieval", "laris-model-client", "laris-store", "laris-core", "laris-tools", "laris-policy", "laris-sandbox", "laris-evidence", "laris-server", "laris-tui", "laris-cli",
    # approved in T119 (direct use; add each when the task that needs it lands)
    "tokio", "axum", "tower-http", "rustls", "reqwest", "serde", "serde_json", "schemars",
    "sqlx", "rusqlite", "ratatui", "crossterm", "clap", "tracing", "thiserror", "sha2", "hmac",
    "uuid", "time", "regex", "globset", "ignore", "similar", "pulldown-cmark", "syntect",
    "landlock", "seccompiler", "windows-sys",
    # transitive crates of the approved ones, as resolved today
    "aho-corasick", "memchr", "regex-automata", "regex-syntax",
    # transitive crates of serde, serde_json and schemars (T123)
    "dyn-clone", "itoa", "proc-macro2", "quote", "ref-cast", "ref-cast-impl", "schemars_derive",
    "serde_core", "serde_derive", "serde_derive_internals", "syn", "unicode-ident", "zmij",
    # transitive crates of sha2 (T126)
    "block-buffer", "cfg-if", "cpufeatures", "crypto-common", "digest", "generic-array", "libc", "typenum",
    "version_check",
    # transitive crates of reqwest (rustls, ring, no default TLS), tokio and rustls (T128)
    "atomic-waker", "base64", "bitflags", "bumpalo", "bytes", "cc", "displaydoc", "find-msvc-tools",
    "form_urlencoded", "futures-channel", "futures-core", "futures-io", "futures-macro", "futures-sink",
    "futures-task", "futures-util", "getrandom", "http", "httparse", "http-body", "http-body-util", "hyper",
    "hyper-rustls", "hyper-util", "icu_collections", "icu_locale_core", "icu_normalizer", "icu_normalizer_data",
    "icu_properties", "icu_properties_data", "icu_provider", "idna", "idna_adapter", "ipnet", "js-sys", "litemap",
    "log", "mio", "once_cell", "percent-encoding", "pin-project-lite", "potential_utf", "ring", "rustls-pki-types",
    "rustls-webpki", "rustversion", "ryu", "serde_urlencoded", "shlex", "slab", "smallvec", "socket2",
    "stable_deref_trait", "subtle", "sync_wrapper", "synstructure", "thiserror-impl", "tinystr", "tokio-macros",
    "tokio-rustls", "tokio-util", "tower", "tower-layer", "tower-service", "tracing-core", "try-lock", "untrusted",
    "url", "utf8_iter", "utf_types", "want", "wasi", "wasm-bindgen", "wasm-bindgen-futures", "wasm-bindgen-macro",
    "wasm-bindgen-macro-support", "wasm-bindgen-shared", "wasm-streams", "web-sys", "windows_aarch64_gnullvm",
    "windows_aarch64_msvc", "windows_i686_gnu", "windows_i686_gnullvm", "windows_i686_msvc", "windows-link",
    "windows-targets", "windows_x86_64_gnu", "windows_x86_64_gnullvm", "windows_x86_64_msvc", "writeable", "yoke",
    "yoke-derive", "zerofrom", "zerofrom-derive", "zeroize", "zerotrie", "zerovec", "zerovec-derive",    # rustls-native-certs, the system trust store of reqwest (T128)
    "core-foundation", "core-foundation-sys", "openssl-probe", "rustls-native-certs", "schannel", "security-framework",
    "security-framework-sys",
    # transitive crates of rusqlite with the bundled SQLite (T129)
    "fallible-iterator", "fallible-streaming-iterator", "foldhash", "hashbrown", "hashlink", "libsqlite3-sys",
    "rsqlite-vfs", "sqlite-wasm-rs",
    "pkg-config", "vcpkg",
    # transitive crates of axum and tokio signal (T141)
    "axum-core", "errno", "httpdate", "matchit", "mime", "signal-hook-registry",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
