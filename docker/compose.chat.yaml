# Serves an open-weight chat model through the model service (T235, ADR-021). Use it on top of compose.yaml:
#   LARIS_MODELS_DIR=$HOME/.cache/huggingface/hub LARIS_CHAT_SNAPSHOT=<snapshot hash> \
#   docker compose -p laris-qwen -f docker/compose.yaml -f docker/compose.chat.yaml up -d --build --wait
# LARIS_MODELS_DIR is the Hugging Face hub cache (mounted read-only at /weights): the model's blobs live in a store
# shared with other models, so its own folder alone would hold broken links. The snapshot is the folder name under
# models--Qwen--<LARIS_CHAT_MODEL, default Qwen3.5-4B>/snapshots/. The container has no route out: nothing is downloaded, the weights must be there.
# Needs the NVIDIA container runtime. A different project name (-p) keeps its own volumes and certificate authority.
services:
  model:
    build:
      args:
        MODEL_EXTRAS: chat
    image: laris-model-chat:${LARIS_TAG:-dev}
    environment:
      LARIS_MODEL_SERVICE__BACKEND: laris.model.inference.open_llm:OpenWeightChat
      LARIS_MODEL_SERVICE__CHAT_MODEL_ID: /weights/models--Qwen--${LARIS_CHAT_MODEL:-Qwen3.5-4B}/snapshots/${LARIS_CHAT_SNAPSHOT:?set LARIS_CHAT_SNAPSHOT to the snapshot folder name}
      HF_HUB_OFFLINE: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True   # no fragmentation: memory freed after a reply really is free
      HOME: /tmp
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      start_period: 120s
