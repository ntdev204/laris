# One machine: Caddy (public) -> laris-server -> model service, with PostgreSQL. Only Caddy publishes ports.
# Policy (.laris) and weights are mounted read-only; secrets are Docker secrets. Run from the repository root:
#   docker/init-secrets.sh && docker compose -f docker/compose.yaml up -d --build --wait
# The volume names are those of the trial server (laris_caddy_data, laris_pgdata): an upgrade keeps them.
# See docs/deployment/RUNBOOK.md.
name: laris

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${LARIS_HTTP_PORT:-80}:80"
      - "${LARIS_HTTPS_PORT:-443}:443"
    environment:
      LARIS_DOMAIN: ${LARIS_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, internal]
    depends_on:
      server:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    image: laris-server:${LARIS_TAG:-dev}
    restart: unless-stopped
    environment:
      LARIS_SERVER__BIND: 0.0.0.0:8080
      LARIS_SERVER__POLICY_ROOT: /policy
      LARIS_SERVER__MODEL_URL: http://model:8001
      LARIS_SERVER__DATABASE_URL_FILE: /run/secrets/database_url
      LARIS_SERVER__MASTER_FILE: /run/secrets/master_secret
      LARIS_SERVER__FIRST_ADMIN_FILE: /state/first_admin_key
      LARIS_SERVER__DATABASE_SCHEMA: laris2          # generation 2 stands alone beside the trial server's tables
      # the built-in admin key works only from the machine itself: the edge gateway is how the host appears
      LARIS_SERVER__SERVER_IPS: ${LARIS_EDGE_GATEWAY:-172.31.1.1}
      LARIS_SERVER__TRUSTED_PROXIES: ${LARIS_SUBNET:-172.31.0.0/24}   # Caddy, on the internal network
    secrets: [database_url, master_secret]
    volumes:
      - ../.laris:/policy/.laris:ro
      - server_state:/state
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      model:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # the image has no shell and no curl: the binary answers its own probe
      test: ["CMD", "/usr/local/bin/laris-server", "probe", "localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  model:
    build:
      context: ..
      dockerfile: docker/model.Dockerfile
    image: laris-model:${LARIS_TAG:-dev}
    restart: unless-stopped
    environment:
      LARIS_MODEL_SERVICE__BACKEND: ${LARIS_MODEL_BACKEND:-}
    volumes:
      - ${LARIS_MODELS_DIR:-../artifacts/weights}:/weights:ro
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: laris
      POSTGRES_DB: laris
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laris -d laris"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  edge:
    ipam:
      config:
        - subnet: ${LARIS_EDGE_SUBNET:-172.31.1.0/24}   # the host reaches Caddy from this network's gateway
  internal:
    internal: true            # no route out: server, model and postgres cannot reach the Internet
    ipam:
      config:
        - subnet: ${LARIS_SUBNET:-172.31.0.0/24}

volumes:
  caddy_data: {}
  caddy_config: {}
  pgdata: {}
  server_state: {}

secrets:
  database_url:
    file: ./secrets/database_url
  master_secret:
    file: ./secrets/master.secret
  postgres_password:
    file: ./secrets/postgres_password
