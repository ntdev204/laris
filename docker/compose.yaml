# One machine: Caddy (public) -> laris-server -> model service, with PostgreSQL. Only Caddy publishes ports.
# Policy (.laris) and weights are mounted read-only; secrets are Docker secrets. Run from the repository root:
#   docker/init-secrets.sh && docker compose -f docker/compose.yaml up -d --build --wait
# The volume names are those of the trial server (laris_caddy_data, laris_pgdata): an upgrade keeps them.
# See docs/deployment/RUNBOOK.md.
name: laris

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "${LARIS_HTTP_PORT:-80}:80"
      - "${LARIS_HTTPS_PORT:-443}:443"
    environment:
      LARIS_DOMAIN: ${LARIS_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/etc/caddy/tls:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, internal]
    depends_on:
      server:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, DAC_READ_SEARCH]   # DAC_READ_SEARCH: read the 0600 key that `tailscale cert` writes (docker/tls)
    security_opt: ["no-new-privileges:true"]

  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    image: laris-server:${LARIS_TAG:-dev}
    restart: unless-stopped
    environment:
      LARIS_SERVER__BIND: 0.0.0.0:8080
      LARIS_SERVER__POLICY_ROOT: /policy
      LARIS_SERVER__MODEL_URL: http://model:8001
      LARIS_SERVER__DATABASE_URL_FILE: /run/secrets/database_url
      LARIS_SERVER__MASTER_FILE: /run/secrets/master_secret
      LARIS_SERVER__FIRST_ADMIN_FILE: /state/first_admin_key
      LARIS_SERVER__DATABASE_SCHEMA: laris2          # generation 2 stands alone beside the trial server's tables
      # the built-in admin key works only from the machine itself: the edge gateway is how the host appears
      LARIS_SERVER__SERVER_IPS: ${LARIS_EDGE_GATEWAY:-172.31.1.1}
      LARIS_SERVER__TRUSTED_PROXIES: ${LARIS_SUBNET:-172.31.0.0/24}   # Caddy, on the internal network
      # Request pipeline (ADR-025, T243): each stage is a setting; LARIS_PIPELINE_* in docker/laris.env or the shell override.
      # LARIS_PIPELINE_PREFILTER=false and LARIS_PIPELINE_GROUNDING=off with LARIS_DECIDER_ENABLED=false is the plain gateway.
      LARIS_SERVER__PIPELINE_PREFILTER: ${LARIS_PIPELINE_PREFILTER:-true}
      LARIS_SERVER__PIPELINE_GROUNDING: ${LARIS_PIPELINE_GROUNDING:-optional}   # optional | required | off
      LARIS_SERVER__PIPELINE_COMPOSE_WITHOUT_MODEL: ${LARIS_PIPELINE_COMPOSE_WITHOUT_MODEL:-true}
      LARIS_SERVER__PIPELINE_MAX_EVIDENCE_CHARS: ${LARIS_PIPELINE_MAX_EVIDENCE_CHARS:-6144}
      LARIS_SERVER__PIPELINE_MAX_DRAFT_CHARS: ${LARIS_PIPELINE_MAX_DRAFT_CHARS:-65536}
      LARIS_SERVER__PIPELINE_STAGE_TIMEOUT_MS: ${LARIS_PIPELINE_STAGE_TIMEOUT_MS:-120000}
      LARIS_SERVER__MAX_BODY_BYTES: ${LARIS_MAX_BODY_BYTES:-1048576}   # the research-gap analysis sends every paper's text (T272)
      # The main brain: one vault in the state volume, written only through the write gate (admin routes).
      # The thresholds are starting values, not tuned on any measurement (see the T243 report).
      LARIS_SERVER__MAIN_BRAIN_DIR: /state/brain
      LARIS_SERVER__MAIN_BRAIN_MIN_SUPPORT: ${LARIS_BRAIN_MIN_SUPPORT:-0.9}
      LARIS_SERVER__MAIN_BRAIN_MIN_EQUIVALENCE: ${LARIS_BRAIN_MIN_EQUIVALENCE:-0.6}
      LARIS_SERVER__MAIN_BRAIN_SUBJECT_OVERLAP: ${LARIS_BRAIN_SUBJECT_OVERLAP:-0.5}
      LARIS_SERVER__MAIN_BRAIN_SEARCH_DEPTH: ${LARIS_BRAIN_SEARCH_DEPTH:-10}
      LARIS_SERVER__MAIN_BRAIN_MAX_BYTES: ${LARIS_BRAIN_MAX_BYTES:-100000}
      LARIS_SERVER__DECIDER_ENABLED: ${LARIS_DECIDER_ENABLED:-true}
      LARIS_SERVER__DECIDER_REQUIRED_LEVEL: ${LARIS_DECIDER_REQUIRED_LEVEL:-sourced}
      LARIS_SERVER__DECIDER_MIN_COVERAGE: ${LARIS_DECIDER_MIN_COVERAGE:-0.6}
      LARIS_SERVER__DECIDER_MAX_RETRIEVALS: ${LARIS_DECIDER_MAX_RETRIEVALS:-1}
      LARIS_SERVER__DECIDER_MAX_ADVISOR_ASKS: ${LARIS_DECIDER_MAX_ADVISOR_ASKS:-1}
      LARIS_SERVER__DECIDER_MAX_REPEATS: ${LARIS_DECIDER_MAX_REPEATS:-3}
      LARIS_SERVER__DECIDER_ANSWER_MIN_COVER: ${LARIS_DECIDER_ANSWER_MIN_COVER:-0.8}
      LARIS_SERVER__DECIDER_ANSWER_MIN_LEVEL: ${LARIS_DECIDER_ANSWER_MIN_LEVEL:-sourced}
      LARIS_SERVER__DECIDER_ANSWER_MAX_NOTES: ${LARIS_DECIDER_ANSWER_MAX_NOTES:-8}
      LARIS_SERVER__DECIDER_MAX_STEPS: ${LARIS_DECIDER_MAX_STEPS:-10}
      LARIS_SERVER__DECIDER_MAX_SECONDS: ${LARIS_DECIDER_MAX_SECONDS:-180}
      # the source classes a brain-only answer needs (T285): only a certain Claim answers without the model
      LARIS_SERVER__DECIDER_ADMISSIBLE_SOURCES: /config/admissible-sources.json
    secrets: [database_url, master_secret]
    volumes:
      - ../.laris:/policy/.laris:ro
      - ../configs/admissible-sources.json:/config/admissible-sources.json:ro
      - server_state:/state
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      model:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # the image has no shell and no curl: the binary answers its own probe
      test: ["CMD", "/usr/local/bin/laris-server", "probe", "localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  model:
    build:
      context: ..
      dockerfile: docker/model.Dockerfile
    image: laris-model:${LARIS_TAG:-dev}
    restart: unless-stopped
    environment:
      LARIS_MODEL_SERVICE__BACKEND: ${LARIS_MODEL_BACKEND:-}
    volumes:
      - ${LARIS_MODELS_DIR:-../artifacts/weights}:/weights:ro
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: laris
      POSTGRES_DB: laris
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laris -d laris"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  edge:
    ipam:
      config:
        - subnet: ${LARIS_EDGE_SUBNET:-172.31.1.0/24}   # the host reaches Caddy from this network's gateway
  internal:
    internal: true            # no route out: server, model and postgres cannot reach the Internet
    ipam:
      config:
        - subnet: ${LARIS_SUBNET:-172.31.0.0/24}

volumes:
  caddy_data: {}
  caddy_config: {}
  pgdata: {}
  server_state: {}

secrets:
  database_url:
    file: ./secrets/database_url
  master_secret:
    file: ./secrets/master.secret
  postgres_password:
    file: ./secrets/postgres_password
